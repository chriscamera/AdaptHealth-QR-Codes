<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting…</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;
       height:100vh;margin:0;color:#333;text-align:center;padding:20px;}
  a{color:#3d6b4f;}
</style>

</head>
<body>
<div>
  <p>Taking you to the right place…</p>
  <noscript><p>Please enable JavaScript to continue, or check the link with whoever shared it with you.</p></noscript>
</div>
<script>
(function(){
  function qp(name){
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }
  var fallback = qp('u');
  var iosUrl = qp('i') || fallback;
  var androidUrl = qp('a') || fallback;
  var code = qp('c') || '(untagged)';
  window.__qrCode = code;

  var ua = navigator.userAgent || navigator.vendor || window.opera || "";
  var dest = fallback;
  if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) dest = iosUrl;
  else if (/android/i.test(ua)) dest = androidUrl;

  if (window.dataLayer) window.dataLayer.push({ event: 'qr_scan', qr_code: code });
  

  if (dest){
    setTimeout(function(){ window.location.replace(dest); }, 150);
  }
})();
</script>
</body>
</html>
